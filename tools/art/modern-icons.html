const SIZES = [22, 32, 48, 64, 128];
const out = document.getElementById('out');

function render(svgText, size) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, size, size);
      resolve(c.toDataURL('image/png').split(',')[1]);
    };
    img.onerror = () => resolve('ERROR');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText.replace('<svg ', `<svg width="${size}" height="${size}" `));
  });
}

if (location.hash === '#preview') {
  // Preview on a dark and a light background, tinted like Strawberry does.
  document.body.style.cssText = 'margin:0;font:10px sans-serif';
  for (const [bg, fg] of [['#1E1E2E', '#CDD6F4'], ['#FFFAFC', '#5B3A5E']]) {
    const row = document.createElement('div');
    row.style.cssText = `background:${bg};color:${fg};padding:8px`;
    for (const [name, s] of Object.entries(ICONS)) {
      const d = document.createElement('div');
      d.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;width:92px;margin:4px';
      const tinted = s.replaceAll('#FFFFFF', fg);
      d.innerHTML = tinted.replace('<svg ', '<svg width="32" height="32" ') + tinted.replace('<svg ', '<svg width="22" height="22" ') + `<span style="text-align:center">${name}</span>`;
      row.appendChild(d);
    }
    document.body.appendChild(row);
  }
}
else {
  (async () => {
    const lines = [];
    for (const [name, s] of Object.entries(ICONS)) {
      for (const size of SIZES) lines.push(`${name}|${size}|${await render(s, size)}`);
    }
    out.textContent = '@@BEGIN@@\n' + lines.join('\n') + '\n@@END@@';
  })();
}
